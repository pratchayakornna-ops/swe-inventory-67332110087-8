[tool.ruff]
line-length = 100
extend-exclude = [
    "lab04-ai-coding-ux",
    "pricing_legacy.py",
    "lab-04-handout-code",
    "lab-05-handout-code",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
omit = [
    "lab04-ai-coding-ux/*",
    "tests/*",
]
